   <script>
        var uaFull = navigator.userAgent;

        var fwNum = parseFloat(fwVersion);

        }

        function launchExploit() {
            var msgs = document.getElementById("msgs");
            if (msgs) {
                msgs.style.color = "white";
                msgs.innerHTML = "Launching Jailbreak Please Wait...";
            }

            if (fwNum >= 9.00 && fwNum <= 9.60) {
                var script = document.createElement('script');
                script.type = 'module';
                script.src = "900/alert.js";
                script.onerror = onScriptError;
                document.head.appendChild(script);
            }
            else if (fwNum >= 10.00 && fwNum <= 11.02) {

                script.onerror = onScriptError;

	  		   script.src = "slopkit/jb2.js";

            } else {
              if (msgs) msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
