<style>
:root{--gold:#f8d77b;--gold2:#b87922;--glass:rgba(5,8,17,.72);--line:rgba(255,218,135,.72)}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
 background:#080a12 url("omarkoxe_background.jpg") center center/cover fixed no-repeat;
 color:#fff;font-family:Georgia,"Times New Roman",serif;text-align:center;
 overflow-x:hidden;position:relative;padding:24px 18px 30px;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;

 z-index:0}
body:after{content:"";position:fixed;inset:10px;pointer-events:none;border:2px solid rgba(248,215,123,.58);
 box-shadow:inset 0 0 24px rgba(255,190,70,.2),0 0 22px rgba(255,190,70,.24);z-index:3}
.brand-shell{position:relative;z-index:1;max-width:1180px;margin:12px auto 0}
.brand-top{display:inline-block;padding:10px 24px;margin-bottom:14px;border:1px solid var(--line);

.brand-card{position:relative;padding:28px 18px 24px;border:2px solid rgba(255,220,145,.82);
 border-radius:24px;background:linear-gradient(135deg,rgba(8,10,20,.83),rgba(26,17,10,.68),rgba(5,10,20,.84));
 box-shadow:0 0 18px rgba(255,190,70,.38),0 0 55px rgba(255,170,45,.18),inset 0 0 28px rgba(255,220,150,.12);
 overflow:hidden}
.brand-card:before{content:"";position:absolute;inset:7px;border:1px solid rgba(255,220,145,.35);border-radius:17px;pointer-events:none}
.brand-name{position:relative;margin:0;font-size:clamp(38px,7vw,86px);font-weight:900;letter-spacing:5px;
 line-height:1.08;color:#ffe7a0;
 background:linear-gradient(180deg,#fff9d9 0%,#f9d779 35%,#c27b24 67%,#fff0b5 100%);
 -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
 filter:drop-shadow(0 3px 0 #5b3211) drop-shadow(0 0 12px rgba(255,196,69,.8))}
.brand-sub{margin:12px 0 0;color:#f5e6c2;font:700 13px Arial,sans-serif;letter-spacing:4px;text-shadow:0 0 12px #d79b39}
.flag-line{margin:19px auto 0;width:min(440px,82%);height:7px;border-radius:10px;
 background:linear-gradient(90deg,#d92332 0 33.3%,#fff 33.3% 66.6%,#159447 66.6%);
 box-shadow:0 0 16px rgba(255,220,120,.55)}
#msgs{position:relative;z-index:1;max-width:920px;min-height:82px;margin:24px auto 0;padding:20px 22px;
 display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,220,145,.78);
 border-radius:16px;background:var(--glass);color:#fff;font:700 clamp(18px,2.6vw,29px) Arial,sans-serif;
 line-height:1.4;text-shadow:0 0 10px rgba(255,204,105,.85);
 box-shadow:0 0 20px rgba(255,188,65,.25),inset 0 0 18px rgba(255,255,255,.06)}
.brand-footer{position:relative;z-index:1;margin:22px auto 0;color:#f6dfaa;font:700 12px Arial,sans-serif;
 letter-spacing:3px;text-shadow:0 0 12px #d89b35}
.brand-footer span{display:inline-block;margin:0 8px;color:#ffe8a7}
@keyframes goldPulse{0%,100%{box-shadow:0 0 16px rgba(255,190,70,.28)}50%{box-shadow:0 0 32px rgba(255,210,100,.62)}}
.brand-card{animation:goldPulse 4s ease-in-out infinite}
@media(max-width:700px){body{padding:14px 10px}.brand-card{padding:24px 10px}.brand-name{letter-spacing:2px}.brand-sub{letter-spacing:2px}#msgs{padding:16px 12px}}
</style>

   <script>
        var uaFull = navigator.userAgent;
        var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
        var isPS4 = match !== null;
        var fwVersion = isPS4 ? match[1] : "Unknown";
        var fwNum = parseFloat(fwVersion);

        function onScriptError() {
            var msgs = document.getElementById("msgs");
            if (msgs) msgs.innerHTML = "Content not Found! - Exploitation failed.";
        }

        function launchExploit() {
            var msgs = document.getElementById("msgs");
            if (msgs) {
                msgs.style.color = "white";
                msgs.innerHTML = "Launching Jailbreak Please Wait...";
            }

            if (fwNum >= 9.00 && fwNum <= 9.60) {
                var script = document.createElement('script');
                script.type = 'module';
                script.src = "900/alert.js";
                script.onerror = onScriptError;
                document.head.appendChild(script);
            }
            else if (fwNum >= 10.00 && fwNum <= 11.02) {
                var script = document.createElement('script');
                script.src = "css/main.js";
                script.onerror = onScriptError;
                script.onload = function () {
                setTimeout(function () {
                    doJb();
                }, 500);
            };
            document.head.appendChild(script);
            }
            else if (fwNum == 11.50) {
                var script = document.createElement('script');
                script.type = 'module';
                script.src = "slopkit/chain_lapse.js";
                script.onerror = onScriptError;
                document.head.appendChild(script);
           
            } else if (fwNum >= 12.00 && fwNum <= 14.02) {
               var script = document.createElement('script');
               script.type = 'module';
	  		   script.src = "slopkit/jb2.js";
               script.onerror = onScriptError;
               document.head.appendChild(script);
            } else {
              if (msgs) msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
               }
            }

        // Immediately execute exploit on load if on PS4
        document.addEventListener("DOMContentLoaded", () => {
            if (isPS4) {
                launchExploit();
            } else {
                var msgs = document.getElementById("msgs");
                if (msgs) msgs.innerHTML = "Not a PlayStation 4 Browser.";
				msgs.style.color = "white"; 
            }
        });
    </script>
